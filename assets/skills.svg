<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="auto" fill="none">
<defs><style>
@keyframes radarExpand { 0% { transform: scale(0.1); opacity: 0; } 70% { transform: scale(1.04); opacity: 0.95; } 100% { transform: scale(1); opacity: 1; } }
@keyframes radarPulse { 0%, 100% { opacity: 0.20; } 50% { opacity: 0.42; } }
@keyframes radarSweep { 0% { transform: rotate(0deg); opacity: 0; } 12% { opacity: 0.75; } 70%, 100% { transform: rotate(360deg); opacity: 0; } }
@keyframes vertexPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
.radar-fill { transform-origin: 300px 215px; animation: radarExpand 1.1s cubic-bezier(.2,.9,.3,1) forwards; }
.radar-glow { transform-origin: 300px 215px; animation: radarPulse 2.4s ease-in-out 1.3s infinite; }
.radar-sweep { transform-origin: 300px 215px; animation: radarSweep 4.5s linear 1.4s infinite; }
@keyframes barGrow { 0% { transform: scaleX(0); opacity: 0; } 100% { transform: scaleX(1); opacity: 1; } }
.bar-fill { transform-box: fill-box; transform-origin: left center; animation: barGrow 0.7s ease-out forwards; opacity: 0; }
.vertex { transform-box: fill-box; transform-origin: center; animation: vertexPop 0.4s ease-out forwards; opacity: 0; }
.v-0 { animation-delay: 0.90s; }
.v-1 { animation-delay: 0.98s; }
.v-2 { animation-delay: 1.06s; }
.v-3 { animation-delay: 1.14s; }
.v-4 { animation-delay: 1.22s; }
.v-5 { animation-delay: 1.30s; }
.label { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
.l-0 { animation-delay: 1.00s; }
.l-1 { animation-delay: 1.06s; }
.l-2 { animation-delay: 1.12s; }
.l-3 { animation-delay: 1.18s; }
.l-4 { animation-delay: 1.24s; }
.l-5 { animation-delay: 1.30s; }
</style>
<radialGradient id="radarBg" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/></radialGradient>
